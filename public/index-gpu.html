<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASXR-GPU v4.0 - Python GPU Accelerated Runtime</title>
    <style>
        :root {
            --kuhul-primary: #16f2aa;
            --kuhul-secondary: #00e0ff;
            --kuhul-accent: #9966ff;
            --kuhul-bg: #0a0a1a;
            --kuhul-panel: #070b12;
            --kuhul-text: #e9f5ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--kuhul-bg);
            color: var(--kuhul-text);
            font-family: 'Courier New', monospace;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(22, 242, 170, 0.3);
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--kuhul-primary);
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--kuhul-secondary);
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .panel {
            background: var(--kuhul-panel);
            border: 1px solid rgba(22, 242, 170, 0.3);
            border-radius: 12px;
            padding: 20px;
        }

        .controls-panel {
            grid-column: 1;
        }

        .main-panel {
            grid-column: 2;
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 20px;
        }

        .gpu-stats {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .stat-item {
            text-align: center;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--kuhul-accent);
        }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .kuhul-btn {
            background: linear-gradient(135deg, var(--kuhul-primary), var(--kuhul-secondary));
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            color: #020617;
            font-weight: bold;
            cursor: pointer;
            margin: 5px 0;
            width: 100%;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }

        .kuhul-btn:hover {
            background: linear-gradient(135deg, var(--kuhul-secondary), var(--kuhul-accent));
            transform: translateY(-2px);
        }

        .btn-group {
            margin: 15px 0;
        }

        .btn-group h4 {
            color: var(--kuhul-primary);
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(22, 242, 170, 0.2);
            padding-bottom: 5px;
        }

        .output-console {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            min-height: 300px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid rgba(22, 242, 170, 0.2);
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .log-timestamp {
            color: #7b8a9a;
            margin-right: 10px;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .status-connected {
            background: var(--kuhul-primary);
            box-shadow: 0 0 10px var(--kuhul-primary);
        }

        .status-disconnected {
            background: #ff4757;
            box-shadow: 0 0 10px #ff4757;
        }

        .result-display {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }

        .code-block {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            padding: 10px;
            font-size: 11px;
            overflow-x: auto;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 ASXR-GPU v4.0</h1>
            <div class="subtitle">Python GPU Accelerated Runtime with K'UHUL Language</div>
        </header>

        <div class="dashboard">
            <div class="panel controls-panel">
                <h3>🎯 GPU Controls</h3>

                <div class="gpu-stats">
                    <div>GPU Status:
                        <span class="status-indicator" id="gpu-status">●</span>
                        <span id="gpu-status-text">Checking...</span>
                    </div>
                    <div class="stats-grid" id="gpu-stats-grid"></div>
                </div>

                <div class="btn-group">
                    <h4>🔤 ASC Cipher</h4>
                    <button class="kuhul-btn" onclick="executeVectorEncryption()">(⤍) Vector Encrypt</button>
                    <button class="kuhul-btn" onclick="executeVectorDecryption()">(⤎) Vector Decrypt</button>
                </div>

                <div class="btn-group">
                    <h4>🗜️ SCX Compression</h4>
                    <button class="kuhul-btn" onclick="executeRotationalCompression()">(↻) Rotational Compress</button>
                    <button class="kuhul-btn" onclick="executeSymmetryCompression()">(↔) Symmetry Compress</button>
                </div>

                <div class="btn-group">
                    <h4>🧠 Neural Ops</h4>
                    <button class="kuhul-btn" onclick="executeNeuralPathGen()">(⟿) Neural Path Gen</button>
                    <button class="kuhul-btn" onclick="executeWeightApplication()">(⤂) Weight Application</button>
                </div>

                <div class="btn-group">
                    <h4>🌀 3D Control Flow</h4>
                    <button class="kuhul-btn" onclick="executeSphericalLoop()">(⟲) Spherical Loop</button>
                    <button class="kuhul-btn" onclick="executeVectorConditional()">(⤦) Vector Conditional</button>
                </div>

                <div class="btn-group">
                    <h4>⚙️ System</h4>
                    <button class="kuhul-btn" onclick="checkGPUHealth()">🔄 Check GPU Health</button>
                    <button class="kuhul-btn" onclick="clearGPUMemory()">🧹 Clear GPU Memory</button>
                    <button class="kuhul-btn" onclick="executeBatchOperations()">📦 Batch Operations</button>
                </div>
            </div>

            <div class="panel main-panel">
                <div>
                    <h3>📝 Execution Log</h3>
                    <div class="output-console" id="output-console">
                        <div class="log-entry">
                            <span class="log-timestamp">[00:00:00]</span>
                            <span>ASXR-GPU Dashboard Initialized</span>
                        </div>
                    </div>
                </div>

                <div>
                    <h3>📊 Results</h3>
                    <div class="result-display" id="result-display">
                        <div>Results will appear here...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class ASXRGPUDashboard {
            constructor() {
                this.baseUrl = 'http://localhost:4750';
                this.consoleEl = document.getElementById('output-console');
                this.resultEl = document.getElementById('result-display');
                this.gpuStatusEl = document.getElementById('gpu-status');
                this.gpuStatusText = document.getElementById('gpu-status-text');
                this.statsGrid = document.getElementById('gpu-stats-grid');

                this.checkGPUHealth();
                setInterval(() => this.checkGPUHealth(), 10000);
            }

            log(module, message, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.innerHTML = `
                    <span class="log-timestamp">[${timestamp}]</span>
                    <span style="color: ${this.getColorForType(type)}">${module}: ${message}</span>
                `;
                this.consoleEl.appendChild(entry);
                this.consoleEl.scrollTop = this.consoleEl.scrollHeight;
            }

            getColorForType(type) {
                const colors = {
                    info: '#16f2aa',
                    success: '#00cc88',
                    warning: '#ffaa00',
                    error: '#ff4757',
                    debug: '#9966ff'
                };
                return colors[type] || colors.info;
            }

            displayResult(title, data) {
                this.resultEl.innerHTML = `
                    <h4>${title}</h4>
                    <div class="code-block">${JSON.stringify(data, null, 2)}</div>
                `;
            }

            async checkGPUHealth() {
                try {
                    const response = await fetch(`${this.baseUrl}/api/gpu/health`);
                    const data = await response.json();

                    if (data.ok) {
                        this.gpuStatusEl.className = 'status-indicator status-connected';
                        this.gpuStatusText.textContent = 'Connected';
                        this.updateGPUStats(data.gpu);
                        this.log('SYSTEM', 'GPU Runtime Connected', 'success');
                    } else {
                        this.gpuStatusEl.className = 'status-indicator status-disconnected';
                        this.gpuStatusText.textContent = 'Disconnected';
                        this.log('SYSTEM', 'GPU Runtime Unavailable', 'warning');
                    }

                    return data;
                } catch (error) {
                    this.gpuStatusEl.className = 'status-indicator status-disconnected';
                    this.gpuStatusText.textContent = 'Error';
                    this.log('SYSTEM', `GPU Health Check Failed: ${error.message}`, 'error');
                    return null;
                }
            }

            updateGPUStats(gpuInfo) {
                if (!gpuInfo) return;

                const stats = [
                    { label: 'Device', value: gpuInfo.device || 'Unknown' },
                    { label: 'CUDA', value: gpuInfo.cuda_available ? 'Available' : 'Unavailable' },
                    { label: 'CUDA Ver', value: gpuInfo.cuda_version || 'N/A' }
                ];

                this.statsGrid.innerHTML = stats.map(stat => `
                    <div class="stat-item">
                        <div class="stat-label">${stat.label}</div>
                        <div class="stat-value">${stat.value}</div>
                    </div>
                `).join('');
            }

            async executeKuhulOperation(operation, args = [], kwargs = {}) {
                this.log("K'UHUL", `Executing: ${operation}`, 'info');

                try {
                    const response = await fetch(`${this.baseUrl}/api/kuhul/execute`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ operation, args, kwargs })
                    });

                    const result = await response.json();

                    if (result.success) {
                        this.log('SUCCESS', `Operation completed in ${result.execution_time.toFixed(3)}s`, 'success');
                        this.displayResult(`Result: ${operation}`, result.result);
                        return result;
                    }

                    this.log('ERROR', `Operation failed: ${result.error}`, 'error');
                    return result;
                } catch (error) {
                    this.log('ERROR', `Request failed: ${error.message}`, 'error');
                    return { success: false, error: error.message };
                }
            }

            async executeBatchOperations() {
                const operations = [
                    {
                        operation: '(⤍)',
                        args: ['Secret data for encryption'],
                        kwargs: { path_key: 'M0,0 C100,50 200,150 300,0' }
                    },
                    {
                        operation: '(↻)',
                        args: [[[1, 2, 3], [4, 5, 6], [7, 8, 9]]],
                        kwargs: { angle: 45 }
                    },
                    {
                        operation: '(⟿)',
                        args: ['Generate neural path'],
                        kwargs: { network_params: { hidden_size: 128, num_layers: 2 } }
                    }
                ];

                this.log('BATCH', `Executing ${operations.length} operations`, 'info');

                try {
                    const response = await fetch(`${this.baseUrl}/api/kuhul/batch`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ operations })
                    });

                    const result = await response.json();

                    if (result.success) {
                        this.log('BATCH', `Completed ${result.total_operations} operations in ${result.total_time.toFixed(3)}s`, 'success');
                        this.displayResult('Batch Results', result);
                    } else {
                        this.log('BATCH', 'Batch failed', 'error');
                    }

                    return result;
                } catch (error) {
                    this.log('BATCH', `Request failed: ${error.message}`, 'error');
                    return null;
                }
            }

            async clearGPUMemory() {
                this.log('SYSTEM', 'Clearing GPU memory...', 'info');

                try {
                    const response = await fetch(`${this.baseUrl}/api/gpu/memory/clear`, {
                        method: 'POST'
                    });

                    const result = await response.json();

                    if (result.success) {
                        this.log('SYSTEM', 'GPU memory cleared successfully', 'success');
                    } else {
                        this.log('SYSTEM', 'Failed to clear GPU memory', 'warning');
                    }

                    return result;
                } catch (error) {
                    this.log('ERROR', `Clear memory failed: ${error.message}`, 'error');
                    return null;
                }
            }
        }

        const dashboard = new ASXRGPUDashboard();

        function executeVectorEncryption() {
            dashboard.executeKuhulOperation('(⤍)', ['ASXR-GPU Secret Data'], {
                path_key: 'M0,0 C100,50 200,150 300,0'
            });
        }

        function executeRotationalCompression() {
            dashboard.executeKuhulOperation('(↻)', [
                [[1, 2, 3], [4, 5, 6], [7, 8, 9]]
            ], { angle: 45 });
        }

        function executeNeuralPathGen() {
            dashboard.executeKuhulOperation('(⟿)', ['Generate complex neural path for visualization'], {
                network_params: { hidden_size: 256, num_layers: 3, dropout: 0.1 }
            });
        }

        function executeSphericalLoop() {
            dashboard.executeKuhulOperation('(⟲)', [100, 360]);
        }

        function executeVectorDecryption() {
            dashboard.log('INFO', 'Vector Decryption - Requires encrypted data first', 'info');
        }

        function executeSymmetryCompression() {
            dashboard.executeKuhulOperation('(↔)', [
                [[1, 2, 3], [4, 5, 6], [7, 8, 9]]
            ], { plane: 'vertical' });
        }

        function executeWeightApplication() {
            dashboard.executeKuhulOperation('(⤂)', [
                [0.1, 0.5, 0.8, 0.2, 0.9],
                { complexity: 100 }
            ]);
        }

        function executeVectorConditional() {
            dashboard.executeKuhulOperation('(⤦)', [true, 'Condition is true', 'Condition is false']);
        }

        function executeBatchOperations() {
            dashboard.executeBatchOperations();
        }

        function checkGPUHealth() {
            dashboard.checkGPUHealth();
        }

        function clearGPUMemory() {
            dashboard.clearGPUMemory();
        }

        window.dashboard = dashboard;
    </script>
</body>
</html>
